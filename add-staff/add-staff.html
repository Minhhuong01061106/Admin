        <div class="p-3">
          <h3>Add Staff</h3>
          <div class="p-3 pt-2 border rounded-4">
            <span class="fs-5 fw-bold">Staff Info</span>
            <i
              class="bi bi-question-circle-fill ms-2 rounded-circle pe-2 ps-2 pt-1 pb-1 icon-label"
            ></i>

            <div class="row mt-1">
              <div class="col-sm-12 col-md-3">
                <label for="Name">Name: </label>
                <input type="text" class="rounded-pill w-100" />
              </div>
              <div class="col-sm-12 col-md-3">
                <label for="Name">Phone number: </label>
                <input type="text" class="rounded-pill w-100" />
              </div>
              <div class="col-sm-12 col-md-3">
                <label for="Name">Email Address: </label>
                <input type="text" class="rounded-pill w-100" />
              </div>
              <div class="col-sm-12 col-md-3">
                <label for="Name">Birthday: </label>
                <input type="text" class="rounded-pill w-100" />
              </div>
            </div>
            <hr />
            <span class="fs-5 fw-bold">Staff Type</span>
            <i
              class="bi bi-question-circle-fill ms-2 rounded-circle pe-2 ps-2 pt-1 pb-1 icon-label"
            ></i>
            <div class="row ms-3 mt-1">
              <div class="col-sm-12 col-lg-6 p-0">
                <div class="row">
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities"> Support Staff</span>
                  </div>
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities">Operational Staff</span>
                  </div>
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities">Managerial Staff</span>
                  </div>
                </div>
                <div class="row">
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities"> Intern</span>
                  </div>
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities">Front Office</span>
                  </div>
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities">Executive</span>
                  </div>
                </div>
              </div>
              <div class="col-sm-12 col-lg-6 p-0">
                <div class="row">
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities">Housekeeping </span>
                  </div>
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities">Security</span>
                  </div>
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities"> Engineering</span>
                  </div>
                </div>
                <div class="row">
                  <div class="col-4 col-sm-4 col-lg-4 p-0 pb-3">
                    <input type="radio" class="form-check-input" name="type" />
                    <span class="text-amenities"> IT Support</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="d-flex w-100">
              <button class="btn ms-auto btn-primary">+ Add Staff</button>
            </div>
          </div>
