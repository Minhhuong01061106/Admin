<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calendar</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/b9112cd231.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <div class="row m-0">
      <div
        class="col-tabcontrol d-none d-lg-block col-0 col-lg-2 pt-3 pe-1 ps-1"
      >
        <h5 class="w-100 text-center mt-3 mb-3">
          <i class="fa-solid fa-bed pe-1 text-warning fs-3"></i>
          <span class="fs-3">Hotel System</span>
        </h5>
        <button
          class="btn w-100 text-start border-0 rounded-pill mb-2 pe-4 ps-4"
        >
          <i class="bi bi-house-door-fill fs-5 me-2"></i
          ><span class="fs-6"
            ><a href="home.html" class="text-decoration-none text-black"
              >Home</a
            ></span
          >
        </button>
        <button
          class="btn w-100 text-start border-0 rounded-pill mb-2 pe-4 ps-4"
        >
          <i class="bi bi-box-arrow-down fs-5 pe-2"></i>
          <span class="fs-6"
            ><a href="booking.html" class="text-decoration-none text-black"
              >Bookings</a
            ></span
          >
        </button>
        <button
          class="btn w-100 text-start border-0 rounded-pill mb-2 pe-4 ps-4"
        >
          <i class="bi bi-calendar fs-5 me-2"></i
          ><span class="fs-6"
            ><a href="calendar.html" class="text-decoration-none text-black"
              >Calendar</a
            ></span
          >
        </button>
        <button
          class="btn w-100 text-start border-0 rounded-pill mb-2 pe-4 ps-4"
        >
          <i class="bi bi-hospital fs-5 me-2"></i
          ><span class="fs-6"
            ><a href="./index.html" class="text-decoration-none text-black"
              >Rooms</a
            ></span
          >
        </button>
        <button
          class="btn w-100 text-start border-0 rounded-pill mb-2 pe-4 ps-4"
        >
          <i class="bi bi-person-fill fs-5 me-2"></i
          ><span class="fs-6"
            ><a href="guests.html" class="text-decoration-none text-black"
              >Guests</a
            ></span
          >
        </button>
        <button
          class="btn w-100 text-start border-0 rounded-pill mb-2 pe-4 ps-4"
        >
          <i class="bi bi-droplet fs-5 me-2"></i
          ><span class="fs-6"
            ><a
              href="./house-keeping.html"
              class="text-decoration-none text-black"
              >House keeping</a
            ></span
          >
        </button>
        <button
          class="btn w-100 text-start border-0 rounded-pill mb-2 pe-4 ps-4"
        >
          <i class="bi bi-people fs-5 me-2"></i
          ><span class="fs-6"
            ><a href="staff.html" class="text-decoration-none text-black"
              >Staff</a
            ></span
          >
        </button>
        <hr class="m-0 mb-2" />
        <button class="btn w-100 text-start border-0 rounded-pill pe-4 ps-4">
          <i class="bi bi-gear fs-5 me-2"></i
          ><span class="fs-6"
            ><a href="settings.html" class="text-decoration-none text-black"
              >Settings</a
            ></span
          >
        </button>
      </div>
      <div class="col-main col-12 col-lg-10 m-0 p-0">
        <nav class="navbar navbar-expand-lg p-1">
          <div class="d-flex">
            <button
              class="btn d-block d-lg-none"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#tabCanvas"
            >
              <i class="bi bi-list"></i>
            </button>
            <button class="btn rounded-c d-block d-lg-none">
              <i class="bi bi-search"></i>
            </button>
          </div>

          <div class="input-group d-none d-lg-flex w-50">
            <span
              class="input-group-text rounded-start-pill d-none d-lg-block"
              style="font-size: 10px"
              ><i class="bi bi-search"></i
            ></span>
            <input
              type="text"
              class="form-control rounded-end-pill d-none d-lg-block"
              style="font-size: 10px"
              placeholder="Tìm kiếm..."
            />
          </div>

          <div class="d-flex ms-auto">
            <button class="btn rounded-c">
              <i class="bi bi-bell"></i>
            </button>
            <button class="btn rounded-c">
              <i class="bi bi-inbox"></i>
            </button>
            <button class="btn rounded-c d-flex">
              <i class="bi bi-person"></i>
              <p class="m-0 ps-2 d-none d-lg-block" style="font-size: 15px">
                John Doe
              </p>
              <i class="bi bi-chevron-down ps-2 d-none d-lg-block"></i>
            </button>
          </div>
        </nav>
        <hr class="m-0" />
        <div class="div-calendar ps-3 pe-3 pt-3">
          <h3 class="pb-3">Calendar</h3>
          <div class="calendar border rounded-3 pb-4">
            <div class="d-flex p-2">
              <button class="btn rounded-circle pt-1">&lt;</button>
              <h4 class="m-0 mt-0 rounded-pill pt-1">Tháng 1 Năm 2025</h4>
              <button class="btn rounded-circle pt-1">&gt;</button>
              <div class="ms-auto">
                <select name="month" class="rounded-3 p-1">
                  <option value="">Tháng 1</option>
                  <option value="">Tháng 2</option>
                  <option value="">Tháng 3</option>
                  <option value="">Tháng 4</option>
                  <option value="">Tháng 5</option>
                  <option value="">Tháng 6</option>
                  <option value="">Tháng 7</option>
                  <option value="">Tháng 8</option>
                  <option value="">Tháng 9</option>
                  <option value="">Tháng 10</option>
                  <option value="">Tháng 11</option>
                  <option value="">Tháng 12</option>
                </select>
                <select name="year" class="rounded-3 p-1">
                  <option value="">Năm 2001</option>
                  <option value="">Năm 2002</option>
                  <option value="">Năm 2003</option>
                  <option value="">Năm 2004</option>
                  <option value="">Năm 2005</option>
                  <option value="">Năm 2006</option>
                  <option value="">Năm 2007</option>
                  <option value="">Năm 2008</option>
                  <option value="">Năm 2009</option>
                  <option value="">Năm 2010</option>
                  <option value="">Năm 2011</option>
                  <option value="">Năm 2012</option>
                  <option value="">Năm 2013</option>
                  <option value="">Năm 2014</option>
                  <option value="">Năm 2015</option>
                  <option value="">Năm 2016</option>
                  <option value="">Năm 2017</option>
                  <option value="">Năm 2018</option>
                  <option value="">Năm 2019</option>
                  <option value="">Năm 2020</option>
                  <option value="">Năm 2021</option>
                  <option value="">Năm 2022</option>
                  <option value="">Năm 2023</option>
                  <option value="">Năm 2024</option>
                  <option value="">Năm 2025</option>
                </select>
              </div>
            </div>
            <hr class="m-0" />
            <div class="w-100">
              <table class="w-100 text-center fs-5">
                <thead>
                  <tr>
                    <th>Thứ hai</th>
                    <th>Thứ ba</th>
                    <th>Thứ tư</th>
                    <th>Thứ năm</th>
                    <th>Thứ sáu</th>
                    <th>Thứ bảy</th>
                    <th>Chủ nhật</th>
                  </tr>
                </thead>
                <tbody class="body-table">
                  <tr>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                    <td>5</td>
                    <td>6</td>
                    <td>7</td>
                  </tr>
                  <tr>
                    <td>8</td>
                    <td>9</td>
                    <td>10</td>
                    <td>11</td>
                    <td>12</td>
                    <td>13</td>
                    <td>14</td>
                  </tr>
                  <tr>
                    <td>15</td>
                    <td>16</td>
                    <td>17</td>
                    <td>18</td>
                    <td>19</td>
                    <td>20</td>
                    <td>21</td>
                  </tr>
                  <tr>
                    <td>22</td>
                    <td>23</td>
                    <td>24</td>
                    <td>25</td>
                    <td>26</td>
                    <td>27</td>
                    <td>28</td>
                  </tr>
                  <tr>
                    <td>29</td>
                    <td>30</td>
                    <td>31</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
