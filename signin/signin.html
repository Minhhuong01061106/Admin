<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="signin.css" />

    <script type="text/javascript" src="signin.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/b9112cd231.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div
      class="login-form d-flex justify-content-center align-items-center vh-100"
    >
      <div
        class="bg-white text-white rounded d-grid gap-3 justify-content-center p-5 shadow"
      >
        <div class="header text-center fs-1 text-secondary">
          <i
            class="fa-solid fa-bed pe-1 text-warning fs-1"
            aria-hidden="true"
          ></i>
          <label for="">Hotel System</label>
        </div>
        <input
          type="text"
          id="username"
          placeholder="Username"
          class="rounded-1 border-1 fs-6 border-secondary p-2"
        />
        <input
          type="password"
          id="password"
          placeholder="Password"
          class="rounded-1 border-1 fs-6 border-secondary p-2"
        />
        <button
          id="login"
          type="button"
          onclick="login()"
          class="btn btn-secondary text-white fs-6 p-2"
        >
          Login
        </button>
      </div>
    </div>
  </body>
</html>
